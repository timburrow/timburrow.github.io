name: NMR Tutor bug report
description: Report a reproducible problem with NMR Tutor.
title: "[NMR Tutor bug] "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting a problem. Do not attach confidential, proprietary, patient, or personally identifiable datasets to this public issue. Use private email support at utchemnmr@gmail.com when needed.
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - iPhone
        - iPad
        - Mac
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: NMR Tutor version
      placeholder: "For example: 2.4"
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Describe the problem without including private data.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: List the smallest sequence that reliably shows the problem.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected result
    validations:
      required: true
