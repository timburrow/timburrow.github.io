name: Attenuator bug report
description: Report a reproducible problem with Attenuator.
title: "[Attenuator bug] "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting a problem. Do not include private, confidential, or personally identifiable information in this public issue. Use private email support at utchemnmr@gmail.com when needed.
  - type: dropdown
    id: feature
    attributes:
      label: Feature
      options:
        - Pulse
        - Power
        - Pressure
        - Field
        - Settings
        - Other
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Attenuator version
      placeholder: "For example: 5.50"
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Device and system version
      placeholder: "For example: iPhone 16 Pro, iOS 26"
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Describe the problem without including private information.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: List the smallest sequence that reliably shows the problem.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected result
    validations:
      required: true
